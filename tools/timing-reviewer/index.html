<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IYF Quran · Ayah Timing Review</title>
  <style>
    @font-face {
      font-family: "Amiri Quran";
      src: url("/font/amiri-quran.ttf") format("truetype");
      font-display: swap;
    }
    :root {
      color-scheme: light;
      --canvas: #f4f0e7;
      --surface: #fefcf7;
      --surface-muted: #e8e4da;
      --ink: #14231e;
      --muted: #647069;
      --faint: #7c8780;
      --primary: #1a5549;
      --primary-strong: #123f36;
      --primary-soft: #dce9e3;
      --gold: #a47d42;
      --gold-soft: #eee3cf;
      --danger: #8a3f35;
      --danger-soft: #f2ded9;
      --border: rgba(20, 35, 30, 0.13);
      --shadow: 0 18px 50px rgba(23, 55, 47, 0.10);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { background: var(--canvas); }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--canvas);
      font-family: ui-rounded, "SF Pro Rounded", "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button, select, input { color: inherit; }
    button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible {
      outline: 3px solid rgba(26, 85, 73, 0.28);
      outline-offset: 2px;
    }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: 0.48; }
    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 72px;
      padding: 12px max(20px, calc((100vw - 1180px) / 2));
      border-bottom: 1px solid var(--border);
      background: rgba(244, 240, 231, 0.94);
      backdrop-filter: blur(18px) saturate(115%);
    }
    .identity { min-width: 0; }
    .eyebrow {
      margin: 0 0 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: 21px; line-height: 1.2; letter-spacing: -0.02em; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface);
      font-size: 12px;
      font-weight: 700;
      text-transform: capitalize;
    }
    .status-pill[data-status="verified"] { color: var(--primary-strong); background: var(--primary-soft); }
    .status-pill[data-status="reviewed"] { color: #705322; background: var(--gold-soft); }
    .primary-button, .quiet-button, .nudge-button {
      min-height: 42px;
      border-radius: 11px;
      border: 1px solid var(--border);
      padding: 0 15px;
      background: var(--surface);
      font-weight: 700;
    }
    .primary-button { border-color: var(--primary); color: #fff; background: var(--primary); }
    .primary-button:hover:not(:disabled) { background: var(--primary-strong); }
    .quiet-button:hover:not(:disabled), .nudge-button:hover:not(:disabled) { background: var(--primary-soft); }
    main { width: min(1180px, calc(100% - 40px)); margin: 26px auto 80px; }
    .error-banner, .warning-strip {
      padding: 12px 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.45;
    }
    .error-banner { display: none; margin-bottom: 14px; color: var(--danger); background: var(--danger-soft); }
    .warning-strip { margin-bottom: 16px; color: #66522f; background: var(--gold-soft); }
    .warning-strip ul { margin: 5px 0 0; padding-left: 18px; }
    .transport {
      position: sticky;
      top: 88px;
      z-index: 10;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .transport-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: start; }
    .selection-label { margin: 0 0 4px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .selection-arabic {
      margin: 0;
      min-height: 45px;
      font-family: "Amiri Quran", serif;
      font-size: clamp(25px, 3vw, 34px);
      line-height: 1.8;
      text-align: right;
      direction: rtl;
    }
    .time-readout { text-align: right; font-variant-numeric: tabular-nums; }
    .time-readout strong { display: block; font-size: 23px; letter-spacing: -0.03em; }
    .time-readout span { color: var(--muted); font-size: 12px; }
    audio { width: 100%; height: 40px; margin-top: 10px; }
    .timeline {
      position: relative;
      height: 44px;
      margin: 8px 0 12px;
      border-radius: 9px;
      background: var(--surface-muted);
      overflow: hidden;
      cursor: crosshair;
    }
    .timeline-progress { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--primary-soft); pointer-events: none; }
    .timeline-marker {
      position: absolute;
      top: 9px;
      width: 2px;
      height: 26px;
      padding: 0;
      border: 0;
      border-radius: 2px;
      background: var(--gold);
      transform: translateX(-1px);
    }
    .timeline-marker::after { content: ""; position: absolute; inset: -9px -7px; }
    .timeline-marker.active { width: 4px; background: var(--primary); transform: translateX(-2px); }
    .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); pointer-events: none; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .control-separator { width: 1px; height: 28px; margin: 0 3px; background: var(--border); }
    .nudge-button { min-width: 67px; min-height: 38px; padding: 0 10px; font-variant-numeric: tabular-nums; }
    .evidence { margin: 12px 0 0; color: var(--muted); font-size: 12px; }
    .review-summary {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 20px;
      margin: 30px 0 10px;
    }
    .review-summary h2 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
    .review-summary p { margin: 0; color: var(--muted); font-size: 13px; }
    .boundary-list { border-top: 1px solid var(--border); }
    .boundary-row {
      display: grid;
      grid-template-columns: 72px minmax(220px, 1fr) 142px 130px 76px;
      gap: 14px;
      align-items: center;
      min-height: 96px;
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
      transition: background 120ms ease;
    }
    .boundary-row:hover { background: rgba(254, 252, 247, 0.56); }
    .boundary-row.selected { background: var(--primary-soft); }
    .ayah-key { font-weight: 800; font-variant-numeric: tabular-nums; }
    .ayah-copy { min-width: 0; }
    .ayah-arabic {
      margin: 0;
      font-family: "Amiri Quran", serif;
      font-size: 25px;
      line-height: 1.75;
      text-align: right;
      direction: rtl;
    }
    .ayah-evidence { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.35; }
    .time-input, .status-select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
    }
    .time-input { padding: 0 10px; font-variant-numeric: tabular-nums; }
    .status-select { padding: 0 9px; text-transform: capitalize; }
    .hear-button {
      min-width: 44px;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface);
      font-size: 17px;
    }
    .hear-button:hover { background: var(--gold-soft); }
    .shortcuts {
      margin-top: 26px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }
    kbd { padding: 2px 6px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; background: var(--surface); color: var(--ink); }
    .loading { display: grid; min-height: 70vh; place-items: center; color: var(--muted); }
    .save-state { min-width: 74px; color: var(--muted); font-size: 12px; text-align: right; }
    @media (max-width: 820px) {
      .app-header { align-items: flex-start; padding: 12px 16px; }
      .status-pill { display: none; }
      main { width: min(100% - 24px, 680px); margin-top: 14px; }
      .transport { top: 82px; }
      .transport-top { grid-template-columns: 1fr; gap: 8px; }
      .time-readout { text-align: left; }
      .boundary-row { grid-template-columns: 52px minmax(0, 1fr) 112px; gap: 8px; }
      .ayah-copy { grid-column: 2 / 4; grid-row: 1; }
      .ayah-key { grid-column: 1; grid-row: 1; }
      .time-input { grid-column: 1 / 2; grid-row: 2; }
      .status-select { grid-column: 2; grid-row: 2; }
      .hear-button { grid-column: 3; grid-row: 2; justify-self: end; }
      .ayah-arabic { font-size: 22px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">Verifying exact audio and loading review session…</div>
  <div id="app" hidden>
    <header class="app-header">
      <div class="identity">
        <p class="eyebrow">Muhammad Al-Faqih · Hash-locked source</p>
        <h1 id="title">Ayah timing review</h1>
      </div>
      <div class="header-actions">
        <span id="statusPill" class="status-pill">Candidate</span>
        <span id="saveState" class="save-state">Saved</span>
        <button id="saveButton" class="primary-button" disabled>Save review</button>
      </div>
    </header>

    <main>
      <div id="errorBanner" class="error-banner" role="alert"></div>
      <section id="warnings" class="warning-strip"></section>

      <section class="transport" aria-label="Timing transport">
        <div class="transport-top">
          <div>
            <p id="selectionLabel" class="selection-label"></p>
            <p id="selectionArabic" class="selection-arabic" lang="ar"></p>
          </div>
          <div class="time-readout">
            <strong id="boundaryTime">00:00.000</strong>
            <span><span id="currentTime">00:00.000</span> playhead</span>
          </div>
        </div>
        <audio id="audio" controls preload="metadata" src="/audio"></audio>
        <div id="timeline" class="timeline" role="slider" tabindex="0" aria-label="Track timeline" aria-valuemin="0" aria-valuenow="0">
          <div id="timelineProgress" class="timeline-progress"></div>
          <div id="markers"></div>
          <div id="playhead" class="playhead"></div>
        </div>
        <div class="controls">
          <button id="previousButton" class="quiet-button">Previous</button>
          <button id="transitionButton" class="quiet-button">Hear transition</button>
          <button id="ayahButton" class="quiet-button">Play Ayah</button>
          <button id="nextButton" class="quiet-button">Next</button>
          <span class="control-separator" aria-hidden="true"></span>
          <button class="nudge-button" data-delta="-500">−500 ms</button>
          <button class="nudge-button" data-delta="-100">−100 ms</button>
          <button id="setPlayheadButton" class="quiet-button">Set to playhead</button>
          <button class="nudge-button" data-delta="100">+100 ms</button>
          <button class="nudge-button" data-delta="500">+500 ms</button>
        </div>
        <p id="evidence" class="evidence"></p>
      </section>

      <div class="review-summary">
        <h2>Ayah boundaries</h2>
        <p id="reviewSummary"></p>
      </div>
      <section id="boundaryList" class="boundary-list" aria-label="Ayah boundaries"></section>
      <p class="shortcuts">
        Keyboard: <kbd>J</kbd>/<kbd>K</kbd> boundary · <kbd>Enter</kbd> hear transition ·
        <kbd>[</kbd>/<kbd>]</kbd> nudge 100 ms · <kbd>S</kbd> set to playhead ·
        <kbd>Space</kbd> play/pause · <kbd>⌘S</kbd> save
      </p>
    </main>
  </div>

  <script>
    const state = {
      session: null,
      selected: 0,
      dirty: false,
      stopAt: null,
      saving: false,
    };

    const elements = Object.fromEntries([
      'app', 'loading', 'title', 'statusPill', 'saveState', 'saveButton', 'errorBanner',
      'warnings', 'selectionLabel', 'selectionArabic', 'boundaryTime', 'currentTime',
      'audio', 'timeline', 'timelineProgress', 'markers', 'playhead', 'previousButton',
      'transitionButton', 'ayahButton', 'nextButton', 'setPlayheadButton', 'evidence',
      'reviewSummary', 'boundaryList'
    ].map((id) => [id, document.getElementById(id)]));

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"]/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
      })[character]);
    }

    function formatTime(milliseconds) {
      const safe = Math.max(0, Math.round(milliseconds || 0));
      const minutes = Math.floor(safe / 60000);
      const seconds = Math.floor((safe % 60000) / 1000);
      const millis = safe % 1000;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(millis).padStart(3, '0')}`;
    }

    function point() { return state.session.timing.ayahs[state.selected]; }
    function verse(index = state.selected) { return state.session.verses[index] || { key: '', text: '' }; }
    function durationMs() { return state.session.track.durationMs; }
    function boundaryEnd(index = state.selected) {
      return state.session.timing.ayahs[index + 1]?.startMs ?? durationMs();
    }

    function recomputeOverallStatus() {
      const statuses = state.session.timing.ayahs.map((ayah) => ayah.reviewStatus);
      state.session.timing.reviewStatus = statuses.every((status) => status === 'verified')
        ? 'verified'
        : statuses.every((status) => status !== 'candidate')
          ? 'reviewed'
          : 'candidate';
    }

    function markDirty() {
      state.dirty = true;
      elements.saveButton.disabled = false;
      elements.saveState.textContent = 'Unsaved';
    }

    function showError(message) {
      elements.errorBanner.textContent = message;
      elements.errorBanner.style.display = message ? 'block' : 'none';
    }

    function selectBoundary(index, seek = true) {
      state.selected = Math.max(0, Math.min(state.session.timing.ayahs.length - 1, index));
      if (seek) elements.audio.currentTime = point().startMs / 1000;
      render();
      document.querySelector(`[data-row="${state.selected}"]`)?.scrollIntoView({ block: 'nearest' });
    }

    function adjustBoundary(delta) {
      const current = point();
      const previous = state.session.timing.ayahs[state.selected - 1];
      const next = state.session.timing.ayahs[state.selected + 1];
      const minimum = previous ? previous.startMs + 1 : 0;
      const maximum = (next?.startMs ?? durationMs()) - 1;
      current.startMs = Math.max(minimum, Math.min(maximum, current.startMs + delta));
      current.reviewStatus = 'candidate';
      current.confidence = 0;
      recomputeOverallStatus();
      markDirty();
      elements.audio.currentTime = current.startMs / 1000;
      render();
    }

    function setBoundaryToPlayhead() {
      const desired = Math.round(elements.audio.currentTime * 1000);
      adjustBoundary(desired - point().startMs);
    }

    async function playRange(startMs, endMs) {
      state.stopAt = endMs / 1000;
      elements.audio.currentTime = Math.max(0, startMs) / 1000;
      try { await elements.audio.play(); } catch (error) { showError(String(error)); }
    }

    function playTransition() {
      const start = state.selected === 0 ? point().startMs : point().startMs - 1600;
      playRange(start, Math.min(durationMs(), point().startMs + 2600));
    }

    function playAyah() {
      playRange(point().startMs, boundaryEnd());
    }

    function renderMarkers() {
      const total = durationMs();
      elements.markers.innerHTML = state.session.timing.ayahs.map((ayah, index) => `
        <button
          class="timeline-marker ${index === state.selected ? 'active' : ''}"
          style="left:${(ayah.startMs / total) * 100}%"
          data-marker="${index}"
          title="${escapeHtml(ayah.key)} · ${formatTime(ayah.startMs)}"
          aria-label="Select ${escapeHtml(ayah.key)} at ${formatTime(ayah.startMs)}"
        ></button>
      `).join('');
    }

    function renderRows() {
      elements.boundaryList.innerHTML = state.session.timing.ayahs.map((ayah, index) => {
        const canonical = verse(index);
        return `
          <article class="boundary-row ${index === state.selected ? 'selected' : ''}" data-row="${index}" tabindex="0">
            <div class="ayah-key">${escapeHtml(ayah.key)}</div>
            <div class="ayah-copy">
              <p class="ayah-arabic" lang="ar">${escapeHtml(canonical.text || canonical.key)}</p>
              <p class="ayah-evidence">${escapeHtml(ayah.evidence || 'No candidate evidence recorded')}</p>
            </div>
            <input class="time-input" data-time="${index}" type="number" min="0" max="${durationMs() - 1}" step="1" value="${ayah.startMs}" aria-label="${escapeHtml(ayah.key)} start in milliseconds" />
            <select class="status-select" data-status="${index}" aria-label="${escapeHtml(ayah.key)} review status">
              ${['candidate', 'reviewed', 'verified'].map((status) => `<option value="${status}" ${ayah.reviewStatus === status ? 'selected' : ''}>${status}</option>`).join('')}
            </select>
            <button class="hear-button" data-hear="${index}" aria-label="Hear transition into ${escapeHtml(ayah.key)}">▶</button>
          </article>
        `;
      }).join('');
    }

    function render() {
      const timing = state.session.timing;
      const selectedPoint = point();
      const selectedVerse = verse();
      const verified = timing.ayahs.filter((ayah) => ayah.reviewStatus === 'verified').length;
      const reviewed = timing.ayahs.filter((ayah) => ayah.reviewStatus === 'reviewed').length;
      elements.title.textContent = `Surah ${timing.surah} · ${state.session.audioFile}`;
      elements.statusPill.textContent = timing.reviewStatus;
      elements.statusPill.dataset.status = timing.reviewStatus;
      elements.selectionLabel.textContent = `${selectedPoint.key} · Boundary ${state.selected + 1} of ${timing.ayahs.length}`;
      elements.selectionArabic.textContent = selectedVerse.text || selectedPoint.key;
      elements.boundaryTime.textContent = formatTime(selectedPoint.startMs);
      elements.evidence.textContent = selectedPoint.evidence || 'No candidate evidence recorded.';
      elements.reviewSummary.textContent = `${verified} verified · ${reviewed} reviewed · ${timing.ayahs.length - verified - reviewed} candidate`;
      elements.previousButton.disabled = state.selected === 0;
      elements.nextButton.disabled = state.selected === timing.ayahs.length - 1;
      renderMarkers();
      renderRows();
    }

    async function save() {
      if (state.saving || !state.dirty) return;
      state.saving = true;
      elements.saveButton.disabled = true;
      elements.saveState.textContent = 'Saving…';
      showError('');
      state.session.timing.source.lastReviewedAt = new Date().toISOString();
      try {
        const response = await fetch('/api/timing', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state.session.timing),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Save failed');
        state.dirty = false;
        elements.saveState.textContent = 'Saved';
      } catch (error) {
        elements.saveState.textContent = 'Save failed';
        elements.saveButton.disabled = false;
        showError(error.message || String(error));
      } finally {
        state.saving = false;
      }
    }

    function bindEvents() {
      elements.audio.addEventListener('timeupdate', () => {
        const currentMs = elements.audio.currentTime * 1000;
        elements.currentTime.textContent = formatTime(currentMs);
        const percent = Math.min(100, Math.max(0, (currentMs / durationMs()) * 100));
        elements.timelineProgress.style.width = `${percent}%`;
        elements.playhead.style.left = `${percent}%`;
        elements.timeline.setAttribute('aria-valuemax', String(durationMs()));
        elements.timeline.setAttribute('aria-valuenow', String(Math.round(currentMs)));
        elements.timeline.setAttribute('aria-valuetext', formatTime(currentMs));
        if (state.stopAt !== null && elements.audio.currentTime >= state.stopAt) {
          elements.audio.pause();
          state.stopAt = null;
        }
      });
      elements.audio.addEventListener('loadedmetadata', () => {
        const difference = Math.abs(elements.audio.duration * 1000 - durationMs());
        if (difference > 150) showError(`Decoded browser duration differs from the locked index by ${Math.round(difference)} ms.`);
      });
      elements.timeline.addEventListener('click', (event) => {
        if (event.target.closest('[data-marker]')) return;
        const bounds = elements.timeline.getBoundingClientRect();
        const ratio = Math.min(1, Math.max(0, (event.clientX - bounds.left) / bounds.width));
        elements.audio.currentTime = (durationMs() * ratio) / 1000;
      });
      elements.markers.addEventListener('click', (event) => {
        const marker = event.target.closest('[data-marker]');
        if (marker) selectBoundary(Number(marker.dataset.marker));
      });
      elements.boundaryList.addEventListener('click', (event) => {
        const hear = event.target.closest('[data-hear]');
        if (hear) {
          selectBoundary(Number(hear.dataset.hear), false);
          playTransition();
          return;
        }
        const row = event.target.closest('[data-row]');
        if (row && !event.target.matches('input, select, button')) selectBoundary(Number(row.dataset.row));
      });
      elements.boundaryList.addEventListener('change', (event) => {
        const timeInput = event.target.closest('[data-time]');
        if (timeInput) {
          selectBoundary(Number(timeInput.dataset.time), false);
          const desired = Number(timeInput.value);
          if (Number.isFinite(desired)) adjustBoundary(Math.round(desired) - point().startMs);
          return;
        }
        const status = event.target.closest('[data-status]');
        if (status) {
          selectBoundary(Number(status.dataset.status), false);
          point().reviewStatus = status.value;
          recomputeOverallStatus();
          markDirty();
          render();
        }
      });
      elements.previousButton.addEventListener('click', () => selectBoundary(state.selected - 1));
      elements.nextButton.addEventListener('click', () => selectBoundary(state.selected + 1));
      elements.transitionButton.addEventListener('click', playTransition);
      elements.ayahButton.addEventListener('click', playAyah);
      elements.setPlayheadButton.addEventListener('click', setBoundaryToPlayhead);
      document.querySelectorAll('[data-delta]').forEach((button) => {
        button.addEventListener('click', () => adjustBoundary(Number(button.dataset.delta)));
      });
      elements.saveButton.addEventListener('click', save);
      window.addEventListener('beforeunload', (event) => {
        if (!state.dirty) return;
        event.preventDefault();
        event.returnValue = '';
      });
      document.addEventListener('keydown', (event) => {
        const editing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || '');
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') {
          event.preventDefault();
          save();
          return;
        }
        if (editing) return;
        const key = event.key.toLowerCase();
        if (key === 'j') selectBoundary(state.selected - 1);
        else if (key === 'k') selectBoundary(state.selected + 1);
        else if (event.key === '[') adjustBoundary(-100);
        else if (event.key === ']') adjustBoundary(100);
        else if (key === 's') setBoundaryToPlayhead();
        else if (event.key === 'Enter') playTransition();
        else if (event.key === ' ') {
          event.preventDefault();
          elements.audio.paused ? elements.audio.play() : elements.audio.pause();
        }
      });
    }

    async function init() {
      try {
        const response = await fetch('/api/session');
        if (!response.ok) throw new Error(`Session request failed: ${response.status}`);
        state.session = await response.json();
        elements.warnings.innerHTML = `<strong>Candidate warnings</strong><ul>${(state.session.timing.warnings || []).map((warning) => `<li>${escapeHtml(warning)}</li>`).join('')}</ul>`;
        elements.loading.hidden = true;
        elements.app.hidden = false;
        bindEvents();
        render();
        elements.audio.currentTime = point().startMs / 1000;
      } catch (error) {
        elements.loading.textContent = `Unable to load review session: ${error.message || error}`;
      }
    }

    init();
  </script>
</body>
</html>
